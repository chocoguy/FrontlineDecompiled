# Change this to match the linker version.
# See config.example.yml for a list.
# Unverified: the ELF has no .comment section to read this from.
mw_comment_version: 8

# Relocations dtk's DOL analysis got wrong, checked against the real
# relocations kept in Moh2RelGC.elf (see tools/check_relocs.py). These only
# matter when code or data moves, i.e. non-matching builds.
