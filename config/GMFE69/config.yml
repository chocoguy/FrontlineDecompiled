# See config.example.yml for documentation.
# The game runs from Moh2RelGC.elf (main.dol is only a boot loader), so the
# project is based on a DOL converted from it with `dtk elf2dol`.
object: orig/GMFE69/Moh2RelGC.dol
hash: 0e96c0bea0d7717297f376b7b11229ca99b4b9c6
symbols: config/GMFE69/symbols.txt
